name: Aplicar migrations no banco

# Aplica as migrations de supabase/migrations/ no banco do MedCode.
# Dispara automaticamente quando uma migration nova entra na main.
# Só aplica o que ainda não foi aplicado (idempotente).
#
# Usa a Management API do Supabase (scripts/aplicar-migrations.mjs), então
# precisa só do token de acesso — não da senha do banco. Secrets do repo
# (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN          token da conta Supabase (sbp_...)
#   SUPABASE_PROJECT_REF_MEDCODE   ref do projeto

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    name: Aplicar migrations pendentes
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar migrations pendentes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_MEDCODE }}
        run: node scripts/aplicar-migrations.mjs

  # -------------------------------------------------------------------------
  # Depois de aplicar, confere se a blindagem continua de pé.
  #
  # Ligar RLS em todas as tabelas foi um evento; mantê-lo ligado é um hábito,
  # e hábito some — basta uma migration criar tabela e esquecer o `enable row
  # level security`. Ela nasce aberta ao anônimo e ninguém percebe.
  # -------------------------------------------------------------------------
  conferir-blindagem:
    runs-on: ubuntu-latest
    needs: migrate
    if: always()
    name: Conferir RLS e catálogo de permissões
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: RLS ligado, anon sem privilégio, buckets fechados
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_MEDCODE }}
        run: node scripts/checar-rls.mjs

      - name: Catálogo de permissões do banco igual ao do código
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_MEDCODE }}
        run: node scripts/gerar-catalogo-permissoes.mjs --conferir
